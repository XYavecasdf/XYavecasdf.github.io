<!doctype html><html><head><meta charset='utf-8'><link rel='stylesheet' href='styles.css'></head><body>
<h1 id='settingsTitle'></h1>
<label id='lblTts'></label><input id='ttsLang' value='fr-FR'/><br>
<label id='lblRate'></label><input id='rate' type='number' min='0.5' max='2' step='0.1'/><br>
<label id='lblPitch'></label><input id='pitch' type='number' min='0' max='2' step='0.1'/><br>
<label id='lblMin'></label><input id='minScore' type='number' min='1' max='10'/><br>
<label>Enable suggestion extraction</label><input id='enabled' type='checkbox'/><br>
<button id='saveBtn'>Save</button>
<script src='i18n.js'></script><script src='storage.js'></script><script src='options.js'></script>
</body></html>
