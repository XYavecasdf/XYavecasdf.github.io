name: VowelScope validation smoke tests

on:
  push:
    paths:
      - "vowelscope/validation/**"
      - "vowelscope/index.html"
      - "vowelscope/en/index.html"
      - "vowelscope/dsp/**"
      - "vowelscope/reference-*"
      - ".github/workflows/vowelscope-validation.yml"
  pull_request:
    paths:
      - "vowelscope/validation/**"
      - "vowelscope/index.html"
      - "vowelscope/en/index.html"
      - "vowelscope/dsp/**"
      - "vowelscope/reference-*"
      - ".github/workflows/vowelscope-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check benchmark and importer syntax
        run: |
          node --check vowelscope/validation/benchmark.mjs
          node --check vowelscope/validation/dsp_variants.mjs
          node --check vowelscope/validation/peak_variants.mjs
          node --check vowelscope/validation/peak_guard.mjs
          node --check vowelscope/validation/temporal_variants.mjs
          node --check vowelscope/validation/lpc_poles.mjs
          node --check vowelscope/validation/pole_ceiling_tracking.mjs
          node --check vowelscope/validation/fast_resample.mjs
          node --check vowelscope/validation/test_phase3.mjs
          node --check vowelscope/validation/test_phase3b.mjs
          node --check vowelscope/dsp/core.js
          node --check vowelscope/reference-player.js
          python -m py_compile vowelscope/validation/import_csv.py \
            vowelscope/validation/run_hillenbrand.py \
            vowelscope/validation/analyze_phase1.py \
            vowelscope/validation/classification_experiments.py \
            vowelscope/validation/compare_dsp.py \
            vowelscope/validation/compare_peak_selection.py \
            vowelscope/validation/compare_smoothing.py \
            vowelscope/validation/run_phase3_poles.py \
            vowelscope/validation/compare_reports.py
      - name: Test instrumentation of actual Chinese & English pages
        run: |
          node vowelscope/validation/benchmark.mjs --self-test --page vowelscope/index.html
          node vowelscope/validation/benchmark.mjs --self-test --page vowelscope/en/index.html
      - name: Validate poles and two-path UI on synthesized speech
        run: |
          node vowelscope/validation/test_phase3.mjs
          node vowelscope/validation/test_phase3b.mjs
      - name: Test production state isolation and microphone lifecycle
        run: |
          node --test vowelscope/validation/*.test.mjs
          python -m unittest discover -s vowelscope/validation -p 'test_*.py'
      - name: Validate reference mapping configuration
        run: python -m json.tool vowelscope/validation/mapping.example.json > /dev/null
