name: ConsonantScope real-speech validation

on:
  push:
    branches: [main]
    paths:
      - 'consonantscope/analysis.js'
      - 'consonantscope/vendor/**'
      - 'consonantscope/scripts/**'
      - 'consonantscope/tests/**'
      - 'consonantscope/validation/**'
      - '.github/workflows/consonantscope-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: consonantscope
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Fetch pinned data/models, test, compile and compare
        run: python3 scripts/run-autovot-comparison.py --output "$RUNNER_TEMP/consonantscope-report"
      - name: Publish report as run attachment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consonantscope-real-speech-report
          path: |
            ${{ runner.temp }}/consonantscope-report/results.json
            ${{ runner.temp }}/consonantscope-report/results.csv
            ${{ runner.temp }}/consonantscope-report/autovot-comparison.json
            ${{ runner.temp }}/consonantscope-report/autovot-comparison.csv
          if-no-files-found: error
          retention-days: 30
