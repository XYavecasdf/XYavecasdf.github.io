name: VowelScope Hillenbrand measured baseline

on:
  push:
    paths:
      - ".github/workflows/vowelscope-hillenbrand-baseline.yml"
      - "vowelscope/validation/run_hillenbrand.py"
      - "vowelscope/validation/benchmark.mjs"
      - "vowelscope/index.html"
      - "vowelscope/en/index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original corpus and evaluate actual VowelScope DSP
        run: python vowelscope/validation/run_hillenbrand.py
      - name: Publish aggregated accuracy metrics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vowelscope/validation/public-dataset/hillenbrand-latest.json
          git diff --cached --quiet || (git commit -m "Publish Hillenbrand VowelScope acoustic benchmark summary" && git push)
