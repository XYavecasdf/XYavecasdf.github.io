name: VowelScope Hillenbrand measured baseline

on:
  push:
    paths:
      - ".github/workflows/vowelscope-hillenbrand-baseline.yml"
      - "vowelscope/validation/run_hillenbrand.py"
      - "vowelscope/validation/benchmark.mjs"
      - "vowelscope/validation/analyze_phase1.py"
      - "vowelscope/validation/classification_experiments.py"
      - "vowelscope/validation/compare_dsp.py"
      - "vowelscope/validation/dsp_variants.mjs"
      - "vowelscope/validation/peak_audit.mjs"
      - "vowelscope/validation/peak_variants.mjs"
      - "vowelscope/validation/peak_guard.mjs"
      - "vowelscope/validation/temporal_variants.mjs"
      - "vowelscope/validation/compare_peak_selection.py"
      - "vowelscope/validation/compare_smoothing.py"
      - "vowelscope/index.html"
      - "vowelscope/en/index.html"
  workflow_dispatch:

# Avoid overlapping runs publishing conflicting results after rapid code updates.
concurrency:
  group: vowelscope-hillenbrand-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original corpus and evaluate actual VowelScope DSP
        run: python vowelscope/validation/run_hillenbrand.py
      - name: Publish aggregated performance and diagnostics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vowelscope/validation/public-dataset/hillenbrand-latest.json vowelscope/validation/public-dataset/phase1-diagnostics.json vowelscope/validation/public-dataset/classifier-dev-ablation.json vowelscope/validation/public-dataset/dsp-dev-ablation.json vowelscope/validation/public-dataset/peak-dev-audit.json vowelscope/validation/public-dataset/peak-selector-dev-ablation.json vowelscope/validation/public-dataset/smoothing-dev-ablation.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Hillenbrand VowelScope acoustic benchmark summary"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
